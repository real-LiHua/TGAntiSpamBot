[package]
name = "tg_anti_spam_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
aws-lc-rs = "1.15.3"
dotenvy = "0.15.7"
futures = "0.3.31"
grammers-client = "0.8.1"
grammers-mtsender = "0.8.1"
grammers-session = "0.8.0"
keyring-lib = { version = "1.0.2", features = ["tokio", "rustls"] }
libc = "0.2.180"
nix = { version = "0.30.1", features = ["user"] }
proc-exit = "2.0.2"
rand = "0.9.2"
s2n-tls = "0.3.33"
tempfile = "3.24.0"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "local-time"] }

[profile.release]
lto = true
strip = "symbols"
